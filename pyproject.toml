[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stoplist-ledger"
version = "0.1.0"
description = "Offline version governance and effect verification for stoplists and synonym tables"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask==3.0.3",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
stoplist-ledger = "stoplist_ledger.__main__:main"

[tool.setuptools.packages.find]
include = ["stoplist_ledger*"]

[tool.setuptools.package-data]
stoplist_ledger = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
