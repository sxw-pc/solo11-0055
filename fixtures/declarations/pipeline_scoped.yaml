name: pipeline-scoped
scope: lang-mix
normalization:
  case: nfkc_lower
  whitespace: collapse
tables:
  - id: zh_stop
    version: 2
    scopes: [lang-zh, lang-mix]
  - id: synonym
    version: 1
    scopes: ["*"]
  - id: noise
    version: 1
    scopes: [lang-mix]
  - id: whitelist
    version: 1
    scopes: ["*"]
priority: [whitelist, synonym, noise, zh_stop]
merge_targets: [color, grey]
scope_overrides:
  lang-zh:
    # Whole-list priority replacement; noise stays declared but inactive here.
    priority: [zh_stop, whitelist, synonym, noise]
    merge_targets: [grey, silver]
  lang-zh-redeclare:
    # Restating identical content must yield the same effective rules.
    tables:
      - id: zh_stop
        version: 2
        scopes: [lang-zh, lang-mix]
      - id: synonym
        version: 1
        scopes: ["*"]
      - id: noise
        version: 1
        scopes: [lang-mix]
      - id: whitelist
        version: 1
        scopes: ["*"]
    priority: [whitelist, synonym, noise, zh_stop]
    merge_targets: [color, grey]
  lang-mix:
    # Same scope as the base: a fully restating layer must not move the hash.
    tables:
      - id: zh_stop
        version: 2
        scopes: [lang-zh, lang-mix]
      - id: synonym
        version: 1
        scopes: ["*"]
      - id: noise
        version: 1
        scopes: [lang-mix]
      - id: whitelist
        version: 1
        scopes: ["*"]
    priority: [whitelist, synonym, noise, zh_stop]
    merge_targets: [color, grey]
