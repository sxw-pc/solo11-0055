name: pipeline-b
scope: lang-mix
normalization:
  case: nfkc_lower
  whitespace: collapse
tables:
  - id: zh_stop
    version: 3
    scopes: [lang-zh, lang-mix]
  - id: synonym
    version: 2
    scopes: ["*"]
  - id: noise
    version: 1
    scopes: [lang-mix]
  - id: whitelist
    version: 2
    scopes: ["*"]
priority: [whitelist, synonym, noise, zh_stop]
merge_targets: [color, silver]
